<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Gerenciamento de Seções - SICAMIL"
    >

    <title>
        SICAMIL | Seções
    </title>


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="css/global.css"
    >

    <link
        rel="stylesheet"
        href="css/dashboard.css"
    >

    <link
        rel="stylesheet"
        href="css/secoes.css"
    >

</head>


<body>


    <div class="app-layout">


        <!-- SIDEBAR -->

        <div
            id="sidebar-container"
            aria-label="Menu principal"
        ></div>



        <!-- CONTEÚDO -->

        <main class="main-content">


            <!-- HEADER -->

            <div id="header-container"></div>



            <div class="secoes-content">


                <!-- =========================================
                     CABEÇALHO DA PÁGINA
                ========================================== -->

                <section class="page-heading">

                    <div>

                        <span class="page-kicker">
                            CADASTROS
                        </span>

                        <h2>
                            Gerenciamento de Seções
                        </h2>

                        <p>
                            Cadastre e gerencie as seções utilizadas pelo SICAMIL.
                        </p>

                    </div>


                    <button
                        type="button"
                        id="btnNovaSecao"
                        class="btn-primary"
                    >
                        + Nova Seção
                    </button>

                </section>



                <!-- =========================================
                     MENSAGEM
                ========================================== -->

                <div
                    id="secaoMensagem"
                    class="secao-message"
                    role="alert"
                    hidden
                ></div>



                <!-- =========================================
                     FORMULÁRIO
                ========================================== -->

                <section
                    id="formularioCard"
                    class="form-card"
                    hidden
                >

                    <header class="section-header">

                        <div>

                            <h3 id="tituloFormulario">
                                Nova Seção
                            </h3>

                            <p>
                                Informe os dados da seção.
                            </p>

                        </div>

                    </header>


                    <form
                        id="secaoForm"
                        autocomplete="off"
                    >

                        <input
                            type="hidden"
                            id="secaoId"
                        >


                        <div class="form-grid">


                            <div class="form-group">

                                <label for="secaoSigla">
                                    Sigla
                                </label>

                                <input
                                    type="text"
                                    id="secaoSigla"
                                    name="sigla"
                                    maxlength="30"
                                    placeholder="Digite a sigla"
                                    required
                                >

                            </div>


                            <div class="form-group form-group-name">

                                <label for="secaoNome">
                                    Nome da Seção
                                </label>

                                <input
                                    type="text"
                                    id="secaoNome"
                                    name="nome"
                                    maxlength="120"
                                    placeholder="Digite o nome da seção"
                                    required
                                >

                            </div>

                        </div>


                        <div class="form-actions">

                            <button
                                type="button"
                                id="btnCancelar"
                                class="btn-secondary"
                            >
                                Cancelar
                            </button>


                            <button
                                type="submit"
                                id="btnSalvar"
                                class="btn-primary"
                            >
                                Salvar Seção
                            </button>

                        </div>

                    </form>

                </section>



                <!-- =========================================
                     LISTA
                ========================================== -->

                <section class="sections-card">


                    <header class="section-header">

                        <div>

                            <h3>
                                Seções Cadastradas
                            </h3>

                            <p>
                                Dados registrados no banco do SICAMIL.
                            </p>

                        </div>


                        <div class="section-counter">

                            <span>
                                Total
                            </span>

                            <strong id="totalSecoes">
                                —
                            </strong>

                        </div>

                    </header>



                    <!-- FILTROS -->

                    <div class="filters-row">


                        <div class="search-field">

                            <label
                                for="pesquisaSecao"
                                class="sr-only"
                            >
                                Pesquisar seção
                            </label>

                            <input
                                type="search"
                                id="pesquisaSecao"
                                placeholder="Pesquisar por nome ou sigla..."
                            >

                        </div>


                        <select
                            id="filtroStatus"
                            aria-label="Filtrar seções por status"
                        >

                            <option value="TODAS">
                                Todas
                            </option>

                            <option value="ATIVAS">
                                Ativas
                            </option>

                            <option value="INATIVAS">
                                Inativas
                            </option>

                        </select>

                    </div>



                    <!-- TABELA -->

                    <div class="sections-table-wrapper">

                        <table class="sections-table">

                            <thead>

                                <tr>

                                    <th>
                                        SIGLA
                                    </th>

                                    <th>
                                        NOME DA SEÇÃO
                                    </th>

                                    <th>
                                        STATUS
                                    </th>

                                    <th class="actions-column">
                                        AÇÕES
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="tabelaSecoes">

                                <tr>

                                    <td
                                        colspan="4"
                                        class="table-empty"
                                    >
                                        Carregando seções...
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </div>

        </main>

    </div>


    <script
        type="module"
        src="js/secoes.js"
    ></script>

</body>

</html>
