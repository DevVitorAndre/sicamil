<header class="topbar">

    <!-- =========================================
         ESQUERDA
    ========================================== -->

    <div class="topbar-title">

        <span>

            <span

            </span>


            <div>

            </div>


            <div class="user-info">

                <strong id="usuarioNome">
                    —
                </strong>

                <span id="usuarioTipo">
                    —
                </span>

            </div>

        </div>


        <!-- SAIR -->

        <button
            type="button"
            id="btnSairSistema"
